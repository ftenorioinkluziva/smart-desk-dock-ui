services:
  db:
    image: postgres:16-alpine
    container_name: smart-desk-dock-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-focusdock}
      POSTGRES_USER: ${POSTGRES_USER:-focusdock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - smart-desk-dock-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-focusdock} -d ${POSTGRES_DB:-focusdock}"]
      interval: 5s
      timeout: 5s
      retries: 12

  smart-desk-dock:
    image: ghcr.io/ftenorioinkluziva/smart-desk-dock-ui:main
    container_name: smart-desk-dock
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-focusdock}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-focusdock}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY must be set in .env}
      HOME_ASSISTANT_ALLOWED_HOSTS: ${HOME_ASSISTANT_ALLOWED_HOSTS:?HOME_ASSISTANT_ALLOWED_HOSTS must be set in .env}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  watchtower:
    image: containrrr/watchtower:latest
    container_name: smart-desk-dock-watchtower
    restart: unless-stopped
    command: --interval 60 --label-enable --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/root/.docker/config.json:ro

volumes:
  smart-desk-dock-postgres:
