services:
  db:
    image: postgres:16-alpine
    container_name: smart-desk-dock-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-focusdock}
      POSTGRES_USER: ${POSTGRES_USER:-focusdock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - smart-desk-dock-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-focusdock} -d ${POSTGRES_DB:-focusdock}"]
      interval: 5s
      timeout: 5s
      retries: 12

  smart-desk-dock:
    image: ghcr.io/ftenorioinkluziva/smart-desk-dock-ui:main
    container_name: smart-desk-dock
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-focusdock}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-focusdock}
    ports:
      - "3000:3000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: smart-desk-dock-watchtower
    restart: unless-stopped
    command: --interval 60 --label-enable --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/root/.docker/config.json:ro

volumes:
  smart-desk-dock-postgres:
